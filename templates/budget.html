{% extends "base.html" %}
{% block title %}HERWORTH - Budget{% endblock %}

{% block content %}
<!-- Top Header & Dynamic Summary -->
<div class="mb-8">
    <span class="text-xs font-bold tracking-[0.15em] text-[#A39296] uppercase">BUDGET</span>
    <h2 class="text-4xl font-bold text-[#2B1B22] font-serif-display mt-2">Every dollar, accounted for</h2>
    <p class="text-sm text-[#8C7A7E] mt-2">
        This month: <span class="font-semibold text-[#3D1E28]"><span class="curr-symbol">₹</span><span id="headerIncome">0</span> in</span>, 
        <span class="font-semibold text-[#3D1E28]"><span class="curr-symbol">₹</span><span id="headerExpenses">0</span> out</span> — 
        leaving <span class="font-semibold text-[#3D1E28]"><span class="curr-symbol">₹</span><span id="headerBalance">0</span></span>.
    </p>
</div>

<!-- Entry Input Form Card -->
<div class="bg-white border border-[#F0EAEB] rounded-3xl p-6 shadow-sm mb-8">
    <!-- Type Toggle Buttons (Expense vs Income) -->
    <div class="flex gap-2 mb-5">
        <button id="btnExpense" type="button" onclick="setType('EXPENSE')" class="px-5 py-2 rounded-full text-xs font-bold tracking-wider transition bg-[#3D1E28] text-white">
            EXPENSE
        </button>
        <button id="btnIncome" type="button" onclick="setType('INCOME')" class="px-5 py-2 rounded-full text-xs font-bold tracking-wider transition bg-[#F5EFF2] text-[#8C7A7E] hover:text-[#3D1E28]">
            INCOME
        </button>
    </div>

    <!-- Interactive Form -->
    <form onsubmit="addEntry(event)" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
        <!-- Description Input -->
        <div class="md:col-span-4">
            <input type="text" id="entryDesc" required placeholder="Description" class="w-full bg-[#FAF8F8] border border-[#EBE4E5] rounded-2xl px-4 py-3 text-xs font-medium outline-none focus:border-[#3D1E28]">
        </div>

        <!-- Amount Input -->
        <div class="md:col-span-3">
            <input type="number" step="any" id="entryAmount" required placeholder="Amount" class="w-full bg-[#FAF8F8] border border-[#EBE4E5] rounded-2xl px-4 py-3 text-xs font-medium outline-none focus:border-[#3D1E28]">
        </div>

        <!-- Dynamic Category Select Dropdown -->
        <div class="md:col-span-3 relative">
            <select id="entryCategory" class="w-full appearance-none bg-[#FAF8F8] border border-[#EBE4E5] rounded-2xl px-4 py-3 pr-8 text-xs font-medium text-[#4A3B40] outline-none focus:border-[#3D1E28] cursor-pointer">
                <!-- Dynamically populated via JS -->
            </select>
            <i class="fa-solid fa-chevron-down text-[10px] text-[#A39296] absolute right-4 top-3.5 pointer-events-none"></i>
        </div>

        <!-- Date Picker Input -->
        <div class="md:col-span-2">
            <input type="date" id="entryDate" required class="w-full bg-[#FAF8F8] border border-[#EBE4E5] rounded-2xl px-3 py-3 text-xs font-medium outline-none focus:border-[#3D1E28]">
        </div>

        <!-- Hidden File Input for Image Uploads -->
        <input type="file" id="receiptFileInput" accept="image/*" class="hidden" onchange="handleReceiptUpload(event)">

        <!-- Submit, Upload, & Live Camera Scan Buttons Row -->
        <div class="md:col-span-12 pt-2 flex flex-wrap items-center gap-3">
            <button type="submit" class="bg-[#3D1E28] text-white hover:bg-[#2B1B22] px-6 py-3 rounded-2xl text-xs font-semibold transition shadow-sm">
                Add entry
            </button>

            <!-- File Upload Button -->
            <button type="button" onclick="triggerReceiptScan()" class="bg-[#F5EFF2] text-[#3D1E28] hover:bg-[#EBE4E5] px-6 py-3 rounded-2xl text-xs font-semibold transition shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-file-arrow-up text-xs"></i>
                <span>Upload Bill</span>
            </button>

            <!-- Real-Time Live Camera Scanner Button -->
            <button type="button" onclick="openCameraModal()" id="btnScan" class="bg-[#8E79B4] text-white hover:bg-[#7B66A1] px-6 py-3 rounded-2xl text-xs font-semibold transition shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-camera text-xs"></i>
                <span>AI Scan Bill</span>
            </button>
        </div>
    </form>

    <!-- AI Scan Loading / Feedback Banner -->
    <div id="scanStatusBox" class="hidden mt-4 p-4 rounded-2xl bg-[#F5EFF2] border border-[#EBE4E5] text-xs font-medium text-[#3D1E28] flex items-center gap-3">
        <i class="fa-solid fa-circle-notch fa-spin text-sm text-[#8E79B4]"></i>
        <span id="scanStatusText">Scanning bill & categorizing with Groq AI...</span>
    </div>
</div>

<!-- Transactions List Section -->
<div class="bg-white border border-[#F0EAEB] rounded-3xl shadow-sm overflow-hidden mb-12">
    <!-- Filter Tabs Header -->
    <div class="flex items-center justify-between p-6 border-b border-[#F0EAEB]">
        <h3 class="text-sm font-bold tracking-[0.1em] text-[#3D1E28] uppercase">Transactions</h3>
        
        <div class="flex gap-2 text-xs font-semibold">
            <button onclick="setFilter('ALL')" id="filterAll" class="px-3 py-1.5 rounded-xl bg-[#F5EFF2] text-[#3D1E28]">All</button>
            <button onclick="setFilter('EXPENSE')" id="filterExpense" class="px-3 py-1.5 rounded-xl text-[#8C7A7E] hover:bg-[#F5EFF2]">Expenses</button>
            <button onclick="setFilter('INCOME')" id="filterIncome" class="px-3 py-1.5 rounded-xl text-[#8C7A7E] hover:bg-[#F5EFF2]">Income</button>
        </div>
    </div>

    <!-- Transaction List Container -->
    <div id="transactionList" class="divide-y divide-[#F0EAEB]">
        <!-- Rendered by JS -->
    </div>
</div>

<!-- REAL-TIME CAMERA MODAL OVERLAY -->
<div id="cameraModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-5 max-w-md w-full shadow-2xl flex flex-col max-h-[90vh] space-y-4">
        
        <!-- Modal Header -->
        <div class="flex justify-between items-center shrink-0">
            <h3 class="text-sm font-bold tracking-wider text-[#3D1E28] uppercase">Scan Bill with Camera</h3>
            <button type="button" onclick="closeCameraModal()" class="text-[#A39296] hover:text-[#3D1E28] text-lg font-bold">&times;</button>
        </div>

        <!-- Live Camera Stream Frame -->
        <div class="relative bg-black rounded-2xl overflow-hidden flex-1 min-h-0 flex items-center justify-center">
            <video id="webcamVideo" autoplay playsinline class="w-full h-full object-cover max-h-[55vh]"></video>
            <!-- Offscreen canvas used to grab image frame -->
            <canvas id="snapshotCanvas" class="hidden"></canvas>
        </div>

        <!-- Capture & Cancel Action Row -->
        <div class="flex gap-3 shrink-0 pt-1">
            <button type="button" onclick="captureAndProcess()" class="flex-1 bg-[#3D1E28] text-white py-3 rounded-2xl text-xs font-semibold hover:bg-[#2B1B22] transition">
                Capture & Process
            </button>
            <button type="button" onclick="closeCameraModal()" class="px-5 bg-[#F5EFF2] text-[#8C7A7E] py-3 rounded-2xl text-xs font-semibold hover:text-[#3D1E28] transition">
                Cancel
            </button>
        </div>
    </div>
</div>

<script>
    // Color Palette matching Overview Donut Chart
    const categoryColors = {
        'Housing': '#3D1E28',
        'Food': '#CFA6C0',
        'Fun': '#8E79B4',
        'Health': '#E5B597',
        'Beauty': '#8DBDC0',
        'Education': '#5C82A6',
        'Subscriptions': '#A288A6',
        'Transport': '#B592A0',
        'Salary': '#2B5B45',
        'Freelance': '#4B8B62',
        'Bonus': '#D4A359',
        'Investments': '#3B6E8C',
        'Other': '#E8C5D8'
    };

    const expenseCategories = ['Housing', 'Food', 'Fun', 'Health', 'Beauty', 'Education', 'Subscriptions', 'Transport', 'Other'];
    const incomeCategories = ['Salary', 'Freelance', 'Bonus', 'Investments', 'Other'];

    let currentType = 'EXPENSE';
    let currentFilter = 'ALL';
    let mediaStream = null;

    // Default Initial Transactions
    const defaultTransactions = [
        { id: 1, desc: 'Online course', amount: 150, type: 'EXPENSE', category: 'Education', date: '2026-07-22' },
        { id: 2, desc: 'Salon', amount: 180, type: 'EXPENSE', category: 'Beauty', date: '2026-07-20' },
        { id: 3, desc: 'Dinners out', amount: 310, type: 'EXPENSE', category: 'Fun', date: '2026-07-18' },
        { id: 4, desc: 'Freelance project', amount: 900, type: 'INCOME', category: 'Freelance', date: '2026-07-12' },
        { id: 5, desc: 'Groceries', amount: 540, type: 'EXPENSE', category: 'Food', date: '2026-07-08' },
        { id: 6, desc: 'Health insurance', amount: 260, type: 'EXPENSE', category: 'Health', date: '2026-07-06' },
        { id: 7, desc: 'Streaming + apps', amount: 74, type: 'EXPENSE', category: 'Subscriptions', date: '2026-07-05' },
        { id: 8, desc: 'Metro pass', amount: 120, type: 'EXPENSE', category: 'Transport', date: '2026-07-03' },
        { id: 9, desc: 'Rent', amount: 1850, type: 'EXPENSE', category: 'Housing', date: '2026-07-02' },
        { id: 10, desc: 'Salary', amount: 6200, type: 'INCOME', category: 'Salary', date: '2026-07-01' }
    ];

    // Read Data from Shared Local Storage
    let transactions = JSON.parse(localStorage.getItem('herworth_transactions')) || defaultTransactions;
    let finData = JSON.parse(localStorage.getItem('herworth_finances')) || {
        income: 7100,
        expenses: 3484,
        savings: 28050,
        portfolio: 33880,
        currency: 'INR'
    };

    function initPage() {
        const dateEl = document.getElementById('entryDate');
        if (dateEl) {
            dateEl.value = new Date().toISOString().split('T')[0];
        }
        
        populateCategories();
        updateSummaryAndStorage();
        renderTransactions();
    }

    function setType(type) {
        currentType = type;
        const btnExp = document.getElementById('btnExpense');
        const btnInc = document.getElementById('btnIncome');

        if (btnExp && btnInc) {
            if (type === 'EXPENSE') {
                btnExp.className = "px-5 py-2 rounded-full text-xs font-bold tracking-wider transition bg-[#3D1E28] text-white";
                btnInc.className = "px-5 py-2 rounded-full text-xs font-bold tracking-wider transition bg-[#F5EFF2] text-[#8C7A7E] hover:text-[#3D1E28]";
            } else {
                btnInc.className = "px-5 py-2 rounded-full text-xs font-bold tracking-wider transition bg-[#3D1E28] text-white";
                btnExp.className = "px-5 py-2 rounded-full text-xs font-bold tracking-wider transition bg-[#F5EFF2] text-[#8C7A7E] hover:text-[#3D1E28]";
            }
        }

        populateCategories();
    }

    function populateCategories() {
        const catSelect = document.getElementById('entryCategory');
        if (!catSelect) return;
        const list = currentType === 'EXPENSE' ? expenseCategories : incomeCategories;
        catSelect.innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function addEntry(e) {
        if (e) e.preventDefault();
        const descInput = document.getElementById('entryDesc');
        const amountInput = document.getElementById('entryAmount');
        const catSelect = document.getElementById('entryCategory');
        const dateInput = document.getElementById('entryDate');

        if (!descInput || !amountInput || !catSelect || !dateInput) return;

        const desc = descInput.value.trim();
        const amount = Math.abs(parseFloat(amountInput.value));
        const category = catSelect.value;
        const date = dateInput.value;

        if (!desc || isNaN(amount) || amount <= 0) return;

        const newEntry = {
            id: Date.now(),
            desc,
            amount,
            type: currentType,
            category,
            date
        };

        transactions.unshift(newEntry);

        // Clear input text boxes
        descInput.value = '';
        amountInput.value = '';

        updateSummaryAndStorage();
        renderTransactions();
    }

    function deleteEntry(id) {
        transactions = transactions.filter(t => t.id !== id);
        updateSummaryAndStorage();
        renderTransactions();
    }

    function updateSummaryAndStorage() {
        const totalInc = transactions.filter(t => t.type === 'INCOME').reduce((acc, t) => acc + t.amount, 0);
        const totalExp = transactions.filter(t => t.type === 'EXPENSE').reduce((acc, t) => acc + t.amount, 0);
        const balance = totalInc - totalExp;

        // Keep Overview cards synced in local storage
        finData.income = totalInc;
        finData.expenses = totalExp;
        localStorage.setItem('herworth_finances', JSON.stringify(finData));
        localStorage.setItem('herworth_transactions', JSON.stringify(transactions));

        // Render values
        const hInc = document.getElementById('headerIncome');
        const hExp = document.getElementById('headerExpenses');
        const hBal = document.getElementById('headerBalance');

        if (hInc) hInc.innerText = totalInc.toLocaleString();
        if (hExp) hExp.innerText = totalExp.toLocaleString();
        if (hBal) hBal.innerText = balance.toLocaleString();

        // Update Currency Symbols
        const symbols = { 'INR': '₹', 'USD': '$', 'EUR': '€', 'GBP': '£' };
        const sym = symbols[finData.currency] || '₹';
        document.querySelectorAll('.curr-symbol').forEach(el => el.innerText = sym);
    }

    function setFilter(filter) {
        currentFilter = filter;
        ['All', 'Expense', 'Income'].forEach(f => {
            const btn = document.getElementById('filter' + f);
            if (btn) {
                if (f.toUpperCase() === filter) {
                    btn.className = "px-3 py-1.5 rounded-xl bg-[#F5EFF2] text-[#3D1E28]";
                } else {
                    btn.className = "px-3 py-1.5 rounded-xl text-[#8C7A7E] hover:bg-[#F5EFF2]";
                }
            }
        });
        renderTransactions();
    }

    function renderTransactions() {
        const container = document.getElementById('transactionList');
        if (!container) return;
        
        let filtered = transactions;
        if (currentFilter !== 'ALL') {
            filtered = transactions.filter(t => t.type === currentFilter);
        }

        filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="p-8 text-center text-xs text-[#8C7A7E]">
                    No transactions found in this view.
                </div>
            `;
            return;
        }

        const symbols = { 'INR': '₹', 'USD': '$', 'EUR': '€', 'GBP': '£' };
        const sym = symbols[finData.currency] || '₹';

        container.innerHTML = filtered.map(item => {
            const isExp = item.type === 'EXPENSE';
            const sign = isExp ? '-' : '+';
            const color = categoryColors[item.category] || '#3D1E28';

            return `
                <div class="flex items-center justify-between p-5 hover:bg-[#FAF8F8] transition group">
                    <div class="space-y-1">
                        <div class="text-sm font-semibold text-[#2B1B22]">${item.desc}</div>
                        <div class="flex items-center gap-2 text-xs text-[#8C7A7E]">
                            <span class="inline-block w-2 h-2 rounded-full" style="background-color: ${color}"></span>
                            <span>${item.category}</span>
                            <span>·</span>
                            <span>${item.date}</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <span class="text-sm font-bold ${isExp ? 'text-[#3D1E28]' : 'text-[#2B5B45]'}">
                            ${sign}${sym}${item.amount.toLocaleString()}
                        </span>
                        <button onclick="deleteEntry(${item.id})" class="text-[#A39296] hover:text-[#3D1E28] p-1 transition" title="Delete entry">
                            <i class="fa-regular fa-trash-can text-sm"></i>
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // --- RECEIPT FILE UPLOAD HANDLER ---
    function triggerReceiptScan() {
        const input = document.getElementById('receiptFileInput');
        if (input) input.click();
    }

    async function handleReceiptUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const btnScan = document.getElementById('btnScan');
        const scanStatusBox = document.getElementById('scanStatusBox');
        const scanStatusText = document.getElementById('scanStatusText');

        const formData = new FormData();
        formData.append('receipt_image', file);

        if (btnScan) btnScan.disabled = true;
        if (scanStatusBox) scanStatusBox.classList.remove('hidden');
        if (scanStatusText) scanStatusText.textContent = "Scanning bill & categorizing with Groq AI...";

        try {
            const response = await fetch('/scan-receipt', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok && data.success) {
                data.items.forEach(item => {
                    transactions.unshift({
                        id: Date.now() + Math.random(),
                        desc: item.description,
                        amount: Math.abs(parseFloat(item.amount)),
                        type: 'EXPENSE',
                        category: expenseCategories.includes(item.category) ? item.category : 'Other',
                        date: item.date || new Date().toISOString().split('T')[0]
                    });
                });

                if (scanStatusText) {
                    scanStatusText.textContent = `Success! Parsed and added ${data.items.length} entries.`;
                }

                updateSummaryAndStorage();
                renderTransactions();

                setTimeout(() => {
                    if (scanStatusBox) scanStatusBox.classList.add('hidden');
                }, 3000);
            } else {
                alert(data.error || 'Failed to scan receipt image.');
                if (scanStatusBox) scanStatusBox.classList.add('hidden');
            }
        } catch (err) {
            console.error('Scan Error:', err);
            alert('An error occurred while uploading/scanning the bill.');
            if (scanStatusBox) scanStatusBox.classList.add('hidden');
        } finally {
            if (btnScan) btnScan.disabled = false;
            event.target.value = ''; // Reset file input
        }
    }

    // --- REAL-TIME WEBCAM SCANNER FUNCTIONS ---
    async function openCameraModal() {
        const modal = document.getElementById('cameraModal');
        const video = document.getElementById('webcamVideo');

        if (!modal || !video) return;

        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }
            });
            video.srcObject = mediaStream;
            modal.classList.remove('hidden');
        } catch (err) {
            console.error("Camera access error:", err);
            alert("Unable to access camera. Please make sure your browser has permission to access your webcam/camera.");
        }
    }

    function closeCameraModal() {
        const modal = document.getElementById('cameraModal');
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        if (modal) modal.classList.add('hidden');
    }

    async function captureAndProcess() {
        const video = document.getElementById('webcamVideo');
        const canvas = document.getElementById('snapshotCanvas');
        if (!video || !canvas) return;

        const ctx = canvas.getContext('2d');

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        closeCameraModal();

        const btnScan = document.getElementById('btnScan');
        const scanStatusBox = document.getElementById('scanStatusBox');
        const scanStatusText = document.getElementById('scanStatusText');

        if (btnScan) btnScan.disabled = true;
        if (scanStatusBox) scanStatusBox.classList.remove('hidden');
        if (scanStatusText) scanStatusText.textContent = "Scanning bill & categorizing with Groq AI...";

        canvas.toBlob(async (blob) => {
            if (!blob) {
                alert('Failed to capture frame from webcam.');
                if (btnScan) btnScan.disabled = false;
                if (scanStatusBox) scanStatusBox.classList.add('hidden');
                return;
            }

            const formData = new FormData();
            formData.append('receipt_image', blob, 'webcam_capture.jpg');

            try {
                const response = await fetch('/scan-receipt', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    data.items.forEach(item => {
                        transactions.unshift({
                            id: Date.now() + Math.random(),
                            desc: item.description,
                            amount: Math.abs(parseFloat(item.amount)),
                            type: 'EXPENSE',
                            category: expenseCategories.includes(item.category) ? item.category : 'Other',
                            date: item.date || new Date().toISOString().split('T')[0]
                        });
                    });

                    if (scanStatusText) {
                        scanStatusText.textContent = `Success! Parsed and added ${data.items.length} entries.`;
                    }

                    updateSummaryAndStorage();
                    renderTransactions();

                    setTimeout(() => {
                        if (scanStatusBox) scanStatusBox.classList.add('hidden');
                    }, 3000);
                } else {
                    alert(data.error || 'Failed to scan receipt image.');
                    if (scanStatusBox) scanStatusBox.classList.add('hidden');
                }
            } catch (err) {
                console.error('Scan Error:', err);
                alert('An error occurred while uploading/scanning the bill.');
                if (scanStatusBox) scanStatusBox.classList.add('hidden');
            } finally {
                if (btnScan) btnScan.disabled = false;
            }
        }, 'image/jpeg', 0.9);
    }

    // Safely initialize once DOM finishes rendering
    document.addEventListener('DOMContentLoaded', initPage);
</script>
{% endblock %}
