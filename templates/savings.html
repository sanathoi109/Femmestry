{% extends "base.html" %}
{% block title %}HERWEALTH - Savings{% endblock %}

{% block content %}
<div class="mb-8">
    <h2 class="text-4xl font-bold text-[#2B1B22] font-serif-display">The things you're building toward</h2>
    <p class="text-sm text-[#8C7A7E] mt-2">
        <span class="curr-symbol">₹</span><span id="totalSavedHeader">0</span> saved of 
        <span class="curr-symbol">₹</span><span id="totalTargetHeader">0</span> across 
        <span id="totalGoalsCount">0</span> goals.
    </p>
</div>


<div class="bg-white border border-[#F0EAEB] rounded-3xl p-6 shadow-sm mb-8">
    <form onsubmit="createGoal(event)" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
        
        <div class="md:col-span-3">
            <label class="block text-[10px] font-bold text-[#A39296] tracking-wider uppercase mb-1">GOAL</label>
            <input type="text" id="goalName" required placeholder="Emergency fund" class="w-full bg-[#FAF8F8] border border-[#EBE4E5] rounded-2xl px-4 py-3 text-xs font-medium outline-none focus:border-[#3D1E28]">
        </div>

    
        <div class="md:col-span-3">
            <label class="block text-[10px] font-bold text-[#A39296] tracking-wider uppercase mb-1">PURPOSE</label>
            <select id="goalPurpose" class="w-full bg-[#FAF8F8] border border-[#EBE4E5] rounded-2xl px-4 py-3 text-xs font-medium outline-none focus:border-[#3D1E28] text-[#4A3B40]">
                <option value="EMERGENCY">Emergency</option>
                <option value="HOME">Home</option>
                <option value="TRAVEL">Travel</option>
                <option value="EDUCATION">Education</option>
                <option value="OTHER">Other</option>
            </select>
        </div>

        
        <div class="md:col-span-3">
            <label class="block text-[10px] font-bold text-[#A39296] tracking-wider uppercase mb-1">TARGET</label>
            <input type="number" id="goalTarget" required placeholder="10000" class="w-full bg-[#FAF8F8] border border-[#EBE4E5] rounded-2xl px-4 py-3 text-xs font-medium outline-none focus:border-[#3D1E28]">
        </div>

        
        <div class="md:col-span-3">
            <label class="block text-[10px] font-bold text-[#A39296] tracking-wider uppercase mb-1">BY DATE</label>
            <input type="date" id="goalDate" required class="w-full bg-[#FAF8F8] border border-[#EBE4E5] rounded-2xl px-3 py-3 text-xs font-medium outline-none focus:border-[#3D1E28]">
        </div>

        <div class="md:col-span-12 pt-2">
            <button type="submit" class="bg-[#3D1E28] text-white hover:bg-[#2B1B22] px-6 py-3 rounded-2xl text-xs font-semibold transition shadow-sm">
                Create goal
            </button>
        </div>
    </form>
</div>


<div id="goalsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
    
</div>

<div id="manageModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl relative">
        <button onclick="closeManageModal()" class="absolute top-6 right-6 text-gray-400 hover:text-gray-600 text-xl">
            <i class="fa-solid fa-xmark"></i>
        </button>
        
        <h3 id="manageModalTitle" class="text-2xl font-serif-display font-bold text-[#2B1B22] mb-6">Manage Goal</h3>

        <div class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-[#A39296] tracking-wider uppercase mb-1">AMOUNT</label>
                <input type="number" id="manageAmount" placeholder="500" class="w-full bg-[#FAF8F8] border border-[#EBE4E5] rounded-2xl px-4 py-3 text-sm font-medium outline-none focus:border-[#3D1E28]">
            </div>

            
            <div class="flex gap-3 pt-2">
                <button type="button" id="typeDeposit" onclick="setManageType('DEPOSIT')" class="flex-1 py-3 rounded-2xl text-xs font-bold transition bg-[#3D1E28] text-white">
                    DEPOSIT
                </button>
                <button type="button" id="typeWithdrawal" onclick="setManageType('WITHDRAWAL')" class="flex-1 py-3 rounded-2xl text-xs font-bold transition bg-[#F5EFF2] text-[#8C7A7E]">
                    WITHDRAWAL
                </button>
            </div>

            <button onclick="recordTransaction()" class="w-full bg-[#3D1E28] hover:bg-[#2B1B22] text-white py-3.5 rounded-2xl font-bold text-xs transition mt-4">
                Record
            </button>
        </div>
    </div>
</div>

<div id="sidePanel" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out border-l border-[#F0EAEB] p-6 flex flex-col justify-between">
    <div>
        <div class="flex items-center justify-between pb-6 border-b border-[#F0EAEB] mb-6">
            <h3 class="text-lg font-normal text-[#2B1B22]">Contribution history</h3>
            <button onclick="closeSidePanel()" class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-gray-500 hover:bg-gray-100 transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="historyList" class="space-y-4 max-h-[calc(100vh-140px)] overflow-y-auto pr-1">

        </div>
    </div>
</div>

<script>

    const defaultGoals = [
        {
            id: 101,
            name: "Emergency fund",
            purpose: "EMERGENCY",
            target: 21000,
            saved: 9400,
            byDate: "2027-06-30",
            history: [
                { type: 'Deposit', amount: 1567, date: '2026-07-03', note: 'Auto-transfer' },
                { type: 'Deposit', amount: 1567, date: '2026-06-03', note: 'Auto-transfer' },
                { type: 'Deposit', amount: 1567, date: '2026-05-03', note: 'Auto-transfer' }
            ]
        },
        {
            id: 102,
            name: "Down payment",
            purpose: "HOME",
            target: 45000,
            saved: 12800,
            byDate: "2029-01-01",
            history: [
                { type: 'Deposit', amount: 2000, date: '2026-07-15', note: 'Monthly savings' }
            ]
        }
    ];

    let goals = JSON.parse(localStorage.getItem('herworth_savings_goals')) || defaultGoals;
    let activeGoalId = null;
    let activeManageType = 'DEPOSIT';

    function initSavingsPage() {
        renderGoals();
        updateHeaderSummary();
    }

    function renderGoals() {
        const container = document.getElementById('goalsContainer');
        const currencySym = '₹';

        container.innerHTML = goals.map(goal => {
            const pct = Math.min(100, Math.round((goal.saved / goal.target) * 100)) || 0;
            
        
            const monthsLeft = calculateMonthsLeft(goal.byDate);
            const remaining = Math.max(0, goal.target - goal.saved);
            const monthlyNeed = monthsLeft > 0 ? Math.round(remaining / monthsLeft) : remaining;

            return `
                <div class="bg-white border border-[#F0EAEB] rounded-3xl p-6 shadow-sm relative">
                    <!-- Top Action Icons -->
                    <div class="absolute top-6 right-6 flex items-center gap-3 text-[#A39296]">
                        <button onclick="editGoal(${goal.id})" class="hover:text-[#3D1E28] transition" title="Edit goal">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button onclick="deleteGoal(${goal.id})" class="hover:text-[#3D1E28] transition" title="Delete goal">
                            <i class="fa-regular fa-trash-can text-sm"></i>
                        </button>
                    </div>

                    <div class="flex items-center gap-6">
                        <!-- Circular Donut Chart Progress -->
                        <div class="relative w-24 h-24 flex-shrink-0 flex items-center justify-center">
                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                <path class="text-[#F5EFF2]" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                <path class="text-[#3D1E28]" stroke-width="3" stroke-dasharray="${pct}, 100" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            </svg>
                            <span class="absolute text-xs font-bold text-[#2B1B22]">${pct}%</span>
                        </div>

                        <!-- Goal Information -->
                        <div class="space-y-1">
                            <h3 class="text-xl font-medium text-[#2B1B22] font-serif-display">${goal.name}</h3>
                            <p class="text-[10px] font-bold tracking-wider text-[#A39296] uppercase">
                                ${goal.purpose} · BY ${goal.byDate}
                            </p>
                            <p class="text-sm text-[#3D1E28] font-semibold pt-1">
                                ${currencySym}${goal.saved.toLocaleString()} of ${currencySym}${goal.target.toLocaleString()}
                            </p>
                            <p class="text-xs text-[#8C7A7E]">
                                Need ${currencySym}${monthlyNeed.toLocaleString()}/mo
                            </p>
                        </div>
                    </div>

                    <!-- Bottom Buttons -->
                    <div class="flex items-center gap-4 mt-6 pt-2">
                        <button onclick="openManageModal(${goal.id})" class="bg-[#3D1E28] text-white text-xs font-bold px-6 py-2.5 rounded-2xl hover:bg-[#2B1B22] transition">
                            Manage
                        </button>
                        <button onclick="openSidePanel(${goal.id})" class="flex items-center gap-2 text-xs font-semibold text-[#6E5E63] hover:text-[#3D1E28] transition">
                            <i class="fa-regular fa-rectangle-list text-sm"></i>
                            Panel
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function createGoal(e) {
        e.preventDefault();
        const name = document.getElementById('goalName').value.trim();
        const purpose = document.getElementById('goalPurpose').value;
        const target = parseFloat(document.getElementById('goalTarget').value);
        const byDate = document.getElementById('goalDate').value;

        if (!name || isNaN(target) || target <= 0 || !byDate) return;

        const newGoal = {
            id: Date.now(),
            name,
            purpose,
            target,
            saved: 0,
            byDate,
            history: []
        };

        goals.unshift(newGoal);
        saveAndSync();
        
        
        document.getElementById('goalName').value = '';
        document.getElementById('goalTarget').value = '';
    }

    function editGoal(id) {
        const goal = goals.find(g => g.id === id);
        if (!goal) return;

        const newTarget = prompt(`Edit target amount for "${goal.name}":`, goal.target);
        if (newTarget !== null) {
            const parsed = parseFloat(newTarget);
            if (!isNaN(parsed) && parsed > 0) {
                goal.target = parsed;
                saveAndSync();
            }
        }
    }

    function deleteGoal(id) {
        if (confirm("Are you sure you want to delete this savings goal?")) {
            goals = goals.filter(g => g.id !== id);
            saveAndSync();
        }
    }

    function openManageModal(id) {
        activeGoalId = id;
        const goal = goals.find(g => g.id === id);
        if (!goal) return;

        document.getElementById('manageModalTitle').innerText = `Manage ${goal.name}`;
        document.getElementById('manageAmount').value = '';
        setManageType('DEPOSIT');
        document.getElementById('manageModal').classList.remove('hidden');
    }

    function closeManageModal() {
        document.getElementById('manageModal').classList.add('hidden');
        activeGoalId = null;
    }

    function setManageType(type) {
        activeManageType = type;
        const depBtn = document.getElementById('typeDeposit');
        const withBtn = document.getElementById('typeWithdrawal');

        if (type === 'DEPOSIT') {
            depBtn.className = "flex-1 py-3 rounded-2xl text-xs font-bold transition bg-[#3D1E28] text-white";
            withBtn.className = "flex-1 py-3 rounded-2xl text-xs font-bold transition bg-[#F5EFF2] text-[#8C7A7E]";
        } else {
            withBtn.className = "flex-1 py-3 rounded-2xl text-xs font-bold transition bg-[#3D1E28] text-white";
            depBtn.className = "flex-1 py-3 rounded-2xl text-xs font-bold transition bg-[#F5EFF2] text-[#8C7A7E]";
        }
    }

    function recordTransaction() {
        const amt = parseFloat(document.getElementById('manageAmount').value);
        if (isNaN(amt) || amt <= 0 || !activeGoalId) return;

        const goal = goals.find(g => g.id === activeGoalId);
        if (!goal) return;

        if (activeManageType === 'DEPOSIT') {
            goal.saved += amt;
            goal.history.unshift({
                type: 'Deposit',
                amount: amt,
                date: new Date().toISOString().split('T')[0],
                note: 'Manual Deposit'
            });
        } else {
            goal.saved = Math.max(0, goal.saved - amt);
            goal.history.unshift({
                type: 'Withdrawal',
                amount: amt,
                date: new Date().toISOString().split('T')[0],
                note: 'Manual Withdrawal'
            });
        }

        saveAndSync();
        closeManageModal();
    }

    function openSidePanel(id) {
        const goal = goals.find(g => g.id === id);
        if (!goal) return;

        const listContainer = document.getElementById('historyList');
        const currencySym = '₹';

        if (goal.history.length === 0) {
            listContainer.innerHTML = `<p class="text-xs text-[#8C7A7E] text-center py-6">No contributions recorded yet.</p>`;
        } else {
            listContainer.innerHTML = goal.history.map(item => {
                const isDeposit = item.type === 'Deposit';
                return `
                    <div class="flex items-center justify-between py-3 border-b border-[#F0EAEB]">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-[#F5EFF2] flex items-center justify-center text-[#3D1E28]">
                                <i class="fa-solid ${isDeposit ? 'fa-arrow-up-right-from-square' : 'fa-arrow-down-left-and-arrow-up-right-to-loop'} text-xs"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-[#2B1B22]">${item.type}</p>
                                <p class="text-[10px] text-[#8C7A7E]">${item.date} · ${item.note}</p>
                            </div>
                        </div>
                        <span class="text-xs font-bold ${isDeposit ? 'text-[#2B5B45]' : 'text-[#3D1E28]'}">
                            ${isDeposit ? '+' : '-'}${currencySym}${item.amount.toLocaleString()}
                        </span>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('sidePanel').classList.remove('translate-x-full');
    }

    function closeSidePanel() {
        document.getElementById('sidePanel').classList.add('translate-x-full');
    }

    function updateHeaderSummary() {
        const totalSaved = goals.reduce((acc, g) => acc + g.saved, 0);
        const totalTarget = goals.reduce((acc, g) => acc + g.target, 0);

        document.getElementById('totalSavedHeader').innerText = totalSaved.toLocaleString();
        document.getElementById('totalTargetHeader').innerText = totalTarget.toLocaleString();
        document.getElementById('totalGoalsCount').innerText = goals.length;
    }

    function calculateMonthsLeft(targetDateStr) {
        const today = new Date();
        const targetDate = new Date(targetDateStr);
        const months = (targetDate.getFullYear() - today.getFullYear()) * 12 + (targetDate.getMonth() - today.getMonth());
        return Math.max(1, months);
    }

    function saveAndSync() {
        localStorage.setItem('herworth_savings_goals', JSON.stringify(goals));
        renderGoals();
        updateHeaderSummary();
    }

    // Initialize Page
    initSavingsPage();
</script>
{% endblock %}
