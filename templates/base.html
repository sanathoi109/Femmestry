<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HERWEALTH - Money, Mastered{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        .font-serif-display { font-family: 'Playfair Display', Georgia, serif; }
        
        /* Custom scrollbar for sleeker UI */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FAF8F8;
        }
        ::-webkit-scrollbar-thumb {
            background: #E5DCDD;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #A39296;
        }
    </style>
</head>
<body class="bg-[#FAF8F8] text-[#3A3335] min-h-screen flex font-sans antialiased selection:bg-[#3D1E28] selection:text-white">

    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 bg-[#FAF8F8] border-r border-[#EFEBEA] flex flex-col justify-between p-6 shrink-0 min-h-screen sticky top-0 h-screen">
        <div>
            <!-- BRANDING HEADER -->
            <div class="mb-10 pl-2">
                <a href="{{ url_for('overview') }}" class="group block">
                    <h1 class="text-xl font-bold tracking-[0.2em] text-[#3D1E28] font-serif-display group-hover:opacity-90 transition">HERWORTH</h1>
                    <p class="text-[10px] tracking-widest text-[#8C7A7E] uppercase mt-0.5">MONEY, MASTERED</p>
                </a>
            </div>

            <!-- NAVIGATION LINKS -->
            <nav class="space-y-1 text-sm font-medium">
                <a href="{{ url_for('overview') }}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-[#6E5E63] hover:bg-[#F5EFF2] hover:text-[#3D1E28] transition">
                    <i class="fa-solid fa-border-all text-sm w-5 text-center"></i>
                    Overview
                </a>
                <a href="{{ url_for('budget') }}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-[#6E5E63] hover:bg-[#F5EFF2] hover:text-[#3D1E28] transition">
                    <i class="fa-regular fa-folder text-sm w-5 text-center"></i>
                    Budget
                </a>
                <a href="{{ url_for('savings') }}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-[#6E5E63] hover:bg-[#F5EFF2] hover:text-[#3D1E28] transition">
                    <i class="fa-regular fa-compass text-sm w-5 text-center"></i>
                    Savings
                </a>
                <a href="{{ url_for('learn') }}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-[#6E5E63] hover:bg-[#F5EFF2] hover:text-[#3D1E28] transition">
                    <i class="fa-regular fa-bookmark text-sm w-5 text-center"></i>
                    Learn
                </a>
                <a href="{{ url_for('quiz') }}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-[#6E5E63] hover:bg-[#F5EFF2] hover:text-[#3D1E28] transition">
                    <i class="fa-regular fa-circle-question text-sm w-5 text-center"></i>
                    Quiz
                </a>
                <a href="{{ url_for('coach') }}" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-[#6E5E63] hover:bg-[#F5EFF2] hover:text-[#3D1E28] transition">
                    <i class="fa-solid fa-wand-magic-sparkles text-sm w-5 text-center"></i>
                    Coach
                </a>
            </nav>
        </div>

        <!-- FOOTER / SIGN OUT -->
        <div class="pt-6 border-t border-[#EFEBEA] pl-2">
            <a href="{{ url_for('login') }}" class="flex items-center gap-3 text-sm font-medium text-[#6E5E63] hover:text-[#3D1E28] transition">
                <i class="fa-solid fa-right-from-bracket text-sm"></i>
                Sign out
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 p-10 max-w-7xl mx-auto overflow-y-auto">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
