<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HerWealth - Money, Mastered</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation Bar -->
    <header class="navbar">
        <div class="nav-container">
            
            <!-- Brand Logo & Tagline -->
            <a href="/" class="brand-logo">
                <div class="logo-badge">
                    <span class="rupee-symbol">₹</span>
                    <span class="notification-dot"></span>
                </div>
                <div class="brand-text">
                    <span class="brand-name">HerWealth</span>
                    <span class="brand-tagline">MONEY, MASTERED</span>
                </div>
            </a>

            <!-- Navigation Links -->
            <nav class="nav-links">
                <a href="/" class="nav-item active">Home</a>
                <a href="/learn" class="nav-item">Learn</a>
                <a href="/play" class="nav-item">Play</a>
                <a href="/quiz" class="nav-item">Quiz</a>
                <a href="/coach" class="nav-item">Coach</a>
                <a href="/circle" class="nav-item">Circle</a>
            </nav>

            <!-- Right Action / Logout Icon -->
            <div class="nav-right">
                <a href="/login" class="logout-btn" title="Logout">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </a>
            </div>

        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
